[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conditional-self-diffusion-hsi-sr"
version = "0.1.0"
description = "Conditional self-diffusion for unsupervised hyperspectral image super-resolution"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "torchvision",
  "numpy",
  "scipy",
  "scikit-image",
  "tqdm",
  "tifffile",
  "Pillow",
]

[tool.setuptools.packages.find]
include = ["csdm_hsi*"]
